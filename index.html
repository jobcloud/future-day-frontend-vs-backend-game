<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Day — Koop-Tennis</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="game-area">
        <div class="hud">
          <div class="score" id="score">0</div>
        </div>
        <canvas id="game" width="900" height="635"></canvas>
        <div class="controls-hint">
          <span><b>P1</b>: A / D bewegen</span>
          <span><b>P2</b>: ← / → bewegen</span>
        </div>
      </div>

      <aside class="highscores">
        <h2>🏆 Bestenliste</h2>
        <ol id="highscore-list"></ol>
      </aside>
    </div>

    <!-- Start- / Namens-Dialog -->
    <div class="modal-backdrop" id="start-modal">
      <div class="modal">
        <h1>Koop-Tennis</h1>
        <p>Gib die Spielernamen ein, um zu starten:</p>
        <label>
          Name Spieler 1
          <input type="text" id="name1" maxlength="12" value="P1" />
        </label>
        <label>
          Name Spieler 2
          <input type="text" id="name2" maxlength="12" value="P2" />
        </label>
        <button id="start-btn">Spiel starten</button>
      </div>
    </div>

    <!-- Spielende-Dialog -->
    <div class="modal-backdrop hidden" id="gameover-modal">
      <div class="modal">
        <h1>Ball verloren!</h1>
        <p>Euer Team hat <span id="final-score">0</span> Treffer erzielt.</p>
        <button id="restart-btn">Nochmal spielen</button>
      </div>
    </div>

    <script src="gameplay.js"></script>
    <script src="src/input.js"></script>
    <script src="src/render.js"></script>
    <script src="src/highscore.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
